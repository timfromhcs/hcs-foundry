name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-train-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Test (training tests must not be skipped)
        working-directory: server
        env:
          FOUNDRY_REQUIRE_TRAIN: "1"
        run: python -m pytest -q -rs --strict-markers

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start service
        working-directory: server
        run: |
          python -m foundry.cli serve --port 8770 > /tmp/foundry.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8770/api/v1/health && break
            sleep 1
          done
      - name: Run E2E
        working-directory: web
        run: npx playwright test
      - name: Service log on failure
        if: failure()
        run: tail -n 200 /tmp/foundry.log
