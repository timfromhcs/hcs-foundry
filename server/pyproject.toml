[project]
name = "hcs-foundry"
version = "4.0.0"
description = "HCS Foundry — local-first AI model lab and training workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "psutil>=6.0",
  "zstandard>=0.22",
]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "datasets>=2.19"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
foundry = "foundry.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foundry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
